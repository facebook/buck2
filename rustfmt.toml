# Get help on options with `rustfmt --help=config`
# Please keep these in alphabetical order.
#
# A copy of fbsource's `tools/rust/ossconfigs/rustfmt.toml`, which is what
# `arc f` applies to this code; `fmt.py` (and `buck2 OSS format` in CI) read
# this one. Keep the two identical: `scripts/ci_oss_fmt.py` fails when they
# differ.
edition = "2024"
format_code_in_doc_comments = true
group_imports = "StdExternalCrate"
imports_granularity = "Item"
merge_derives = false
style_edition = "2024"
use_field_init_shorthand = true
