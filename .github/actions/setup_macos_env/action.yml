name: setup_macos_env
description: Setup macOS environment
runs:
  using: composite
  steps:
  - uses: ./.github/actions/setup_rust_toolchain
    with:
      components: clippy
  - name: Brew install
    run: brew install cmake python3 coreutils opam llvm protobuf zstd
    shell: bash
  - name: Install uv
    uses: astral-sh/setup-uv@v5
  - name: Install conan
    run: uv tool install conan==1.*
    shell: bash
  - uses: "./.github/actions/print_versions"
  - uses: actions/setup-go@v5
    with:
      cache: false
      go-version: '~1.22.0'
  - uses: haskell-actions/setup@v2
    with:
      ghc-version: '9.10.1'
