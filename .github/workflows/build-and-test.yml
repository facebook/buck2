name: Build and test
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # allows manual triggering

permissions:
  contents: read

# A pull request's superseded run is cancelled; on `main` the run in flight
# finishes so that every push still gets a verdict (see build-with-buck2.yml).
concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # rust-cache keeps only the dependency artifacts between runs, so every run
  # compiles the workspace crates from scratch and incremental compilation only
  # costs time and disk.
  CARGO_INCREMENTAL: 0
  # Backtraces keep their file:line; nothing in CI attaches a debugger. The
  # `test` profile inherits this from `dev`.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Clippy and rustdoc check the crates; the tests build them. The two share no
  # artifacts, so they run as separate jobs for wall time.
  #
  # Runner labels are repository (owner) specific, so the Meta larger runners
  # (16-core-ubuntu, macos-14-xlarge, windows-8-core) don't exist on forks and
  # jobs requesting them would sit queued forever waiting for a runner that
  # isn't available. Fall back to the standard GitHub-hosted runners there.
  lint:
    name: lint (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runs-on: ${{ github.repository_owner == 'facebook' && '16-core-ubuntu' || 'ubuntu-latest' }}
          - name: macos
            runs-on: ${{ github.repository_owner == 'facebook' && 'macos-14-xlarge' || 'macos-14' }}
          - name: windows
            runs-on: ${{ github.repository_owner == 'facebook' && 'windows-8-core' || 'windows-latest' }}
    runs-on: ${{ matrix.runs-on }}
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup_cargo_env
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: buck2-lint
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Run clippy
      run: python3 test.py --ci --git --lint-only
      shell: bash
    - name: Run rustdoc
      run: python3 test.py --ci --git --rustdoc-only
      shell: bash
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runs-on: ${{ github.repository_owner == 'facebook' && '16-core-ubuntu' || 'ubuntu-latest' }}
          - name: macos
            runs-on: ${{ github.repository_owner == 'facebook' && 'macos-14-xlarge' || 'macos-14' }}
          - name: windows
            runs-on: ${{ github.repository_owner == 'facebook' && 'windows-8-core' || 'windows-latest' }}
    runs-on: ${{ matrix.runs-on }}
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup_cargo_env
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: buck2-test
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Run the tests
      run: python3 test.py --ci --git --test-only
      shell: bash
