name: Setup Linux environment
description: Setup Linux environment
runs:
  using: composite
  steps:
  - uses: ./.github/actions/setup_rust_toolchain
    with:
      components: clippy
  - run: sudo apt-get update
    shell: bash
  - run: sudo apt-get install opam libzstd-dev python3-pip erlang
    shell: bash
  - uses: haskell-actions/setup@v2
    with:
      ghc-version: '9.10.1'
  - name: Install uv
    uses: astral-sh/setup-uv@v5
  - name: Install conan
    run: uv tool install conan==1.*
    shell: bash
  - uses: actions/setup-go@v5
    with:
      cache: false
      go-version: '~1.22.0'
