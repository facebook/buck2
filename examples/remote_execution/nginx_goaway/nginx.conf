# A gRPC reverse proxy in front of bazel-remote that behaves like a typical L7
# load balancer: after `keepalive_requests` requests on a client connection it
# sends a graceful GOAWAY (NO_ERROR) and closes the connection once in-flight
# requests have finished. nginx defaults to 1000; AWS ALB and others have
# similar limits. A low value makes every build see many GOAWAYs.
#
# Paths are relative to the prefix passed with `nginx -p`, see test.sh.

daemon off;
error_log stderr error;
pid nginx.pid;

events {
  # Each proxied call holds an upstream connection, the default of 512 is too
  # small for the number of requests buck2 keeps in flight.
  worker_connections 4096;
}

http {
  # `$connection_requests` reaching `keepalive_requests` means nginx sent a
  # GOAWAY on that connection, test.sh checks that this happened.
  log_format goaway '$connection $connection_requests $status';
  access_log access.log goaway;

  server {
    # `listen ... http2` rather than `http2 on` to support nginx < 1.25.1.
    listen 127.0.0.1:18443 http2;
    keepalive_requests 100;

    location / {
      grpc_pass grpc://127.0.0.1:19092;
    }
  }
}
