# Configuration for Reindeer to generate Buck targets from Cargo.toml
#
# Overview of available options:
# https://github.com/facebookincubator/reindeer/blob/main/example/third-party/reindeer.toml

# Parse Rust code to work out the precise set of source files for each crate.
precise_srcs = true

# Include a public top-level target which depends on all other targets.
include_top_level = true
include_workspace_members = true

[cargo]
# Support Cargo's unstable "artifact dependencies" functionality, RFC 3028.
bindeps = true

# Reindeer's built-in platform list does not include FreeBSD. Defining a custom
# platform list replaces the built-in list, so keep the existing defaults here
# and add x86_64 FreeBSD explicitly.
[platform.linux-x86_64]
target = "x86_64-unknown-linux-gnu"

[platform.linux-arm64]
target = "aarch64-unknown-linux-gnu"

[platform.macos-x86_64]
target = "x86_64-apple-darwin"

[platform.macos-arm64]
target = "aarch64-apple-darwin"

[platform.windows-msvc]
target = "x86_64-pc-windows-msvc"

[platform.windows-gnu]
target = "x86_64-pc-windows-gnu"

[platform.freebsd-x86_64]
target = "x86_64-unknown-freebsd"

[buck]
platform_compatibility_on_all_targets = true

# Rules used for various kinds of targets.
alias = "third_party_rust_alias"
alias_with_platforms = "third_party_rust_alias"
rust_library = "third_party_rust_library"
rust_binary = "third_party_rust_binary"
cxx_library = "third_party_rust_cxx_library"
prebuilt_cxx_library = "third_party_rust_prebuilt_cxx_library"

buckfile_imports = """
load("@prelude//rust:cargo_buildscript.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo")
load(
    "@shim//third-party/macros:rust_third_party.bzl",
    "third_party_rust_alias",
    "third_party_rust_binary",
    "third_party_rust_cxx_library",
    "third_party_rust_library",
    "third_party_rust_prebuilt_cxx_library",
)
"""
